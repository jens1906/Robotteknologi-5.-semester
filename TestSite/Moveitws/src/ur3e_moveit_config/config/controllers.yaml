# Fake controller configuration for UR3e simulation
# This allows MoveIt to "execute" trajectories in simulation by publishing joint states

controller_manager:
  ros__parameters:
    update_rate: 100  # Hz
    
    joint_state_controller:
      type: joint_state_controller/JointStateController
      
    ur_manipulator_controller:
      type: joint_trajectory_controller/JointTrajectoryController

ur_manipulator_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    
    command_interfaces:
      - position
    
    state_interfaces:
      - position
      - velocity
    
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0
