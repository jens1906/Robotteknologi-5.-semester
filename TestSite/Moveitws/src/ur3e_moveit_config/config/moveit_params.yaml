# MoveIt configuration for UR3e demo
# This file combines kinematics and joint limits in the format MoveIt expects

# Robot description kinematics
robot_description_kinematics:
  ur_manipulator:
    kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
    kinematics_solver_search_resolution: 0.005
    kinematics_solver_timeout: 0.05
    kinematics_solver_attempts: 3

# Joint limits with acceleration
robot_description_planning:
  joint_limits:
    shoulder_pan_joint:
      has_velocity_limits: true
      max_velocity: 3.15
      has_acceleration_limits: true
      max_acceleration: 5.0
    shoulder_lift_joint:
      has_velocity_limits: true
      max_velocity: 3.15
      has_acceleration_limits: true
      max_acceleration: 5.0
    elbow_joint:
      has_velocity_limits: true
      max_velocity: 3.15
      has_acceleration_limits: true
      max_acceleration: 5.0
    wrist_1_joint:
      has_velocity_limits: true
      max_velocity: 3.2
      has_acceleration_limits: true
      max_acceleration: 5.0
    wrist_2_joint:
      has_velocity_limits: true
      max_velocity: 3.2
      has_acceleration_limits: true
      max_acceleration: 5.0
    wrist_3_joint:
      has_velocity_limits: true
      max_velocity: 3.2
      has_acceleration_limits: true
      max_acceleration: 5.0

# ADDED: Controller configuration for trajectory execution
moveit_simple_controller_manager:
  controller_names:
    - ur_manipulator_controller
  
  ur_manipulator_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
