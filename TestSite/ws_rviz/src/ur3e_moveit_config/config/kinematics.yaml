ur3e_manipulator:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.0005  # Finer search (0.005 -> 0.001 = 5x more attempts)
  kinematics_solver_timeout: 1  # 10x longer timeout (0.05 -> 0.5 seconds)
  kinematics_solver_attempts: 10  # Try multiple times with different seeds
